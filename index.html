<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomad Rent — Аренда авто</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #222;
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .logo span {
      color: #e5a93c;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
    }
    .btn-outline:hover {
      border-color: #e5a93c;
      color: #e5a93c;
    }

    .btn-primary {
      background: #e5a93c;
      color: #000;
    }
    .btn-primary:hover {
      background: #d4982b;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Табы категорий */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .cat-tab {
      background: #1e1e1e;
      color: #888;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .cat-tab.active {
      background: #e5a93c;
      color: #000;
      border-color: #e5a93c;
    }

    /* Сетка авто */
    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .car-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .car-visual {
      width: 100%;
      height: 180px;
      background: #252525;
      overflow: hidden;
    }

    .car-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .car-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .car-cat {
      font-size: 12px;
      color: #e5a93c;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .car-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .car-specs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .car-spec {
      font-size: 12px;
      background: #2a2a2a;
      padding: 4px 8px;
      border-radius: 4px;
      color: #aaa;
    }

    .car-foot {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .car-price {
      font-size: 18px;
      font-weight: 700;
    }

    .car-price span {
      font-size: 12px;
      color: #888;
      font-weight: 400;
    }

    .book-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #333;
    }

    .book-btn:hover {
      background: #e5a93c;
      color: #000;
    }

    /* Модальные окна */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      z-index: 100;
    }
    .overlay.show { display: block; }

    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      display: none;
      z-index: 101;
    }
    .modal.show { display: block; }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      padding: 0;
    }

    .modal h3 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .modal-sub {
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: #e5a93c;
    }

    .field-row {
      display: flex;
      gap: 12px;
    }

    .field-row .field { flex: 1; }

    /* Префикс телефона */
    .phone-input-group {
      display: flex;
      align-items: center;
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .phone-input-group:focus-within {
      border-color: #e5a93c;
    }
    .phone-prefix {
      padding: 0 12px;
      color: #e5a93c;
      font-weight: 600;
      user-select: none;
      border-right: 1px solid #333;
      font-size: 14px;
    }
    .phone-input-group input {
      border: none !important;
      border-radius: 0 !important;
      width: 100%;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      background: #222;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .form-error {
      color: #ff5555;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .form-error.show { display: block; }

    .btn-google {
      width: 100%;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .auth-divider {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin: 16px 0;
      position: relative;
    }

    .sms-step { display: none; }
    .sms-step.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="logo">NOMAD <span>RENT</span></div>
    <div class="nav-btns">
      <button class="btn-outline" id="openAuthBtn">Профиль</button>
      <button class="btn-primary" onclick="window.open('https://wa.me/996000000000', '_blank')">WhatsApp</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs" id="catTabs"></div>
    <div class="fleet-grid" id="fleetGrid"></div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- Модальное окно бронирования -->
  <div class="modal" id="bookingModal">
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <h3 id="modalCarName">Забронировать</h3>
    <p class="modal-sub" id="modalCarSpecs"></p>

    <div class="field-row">
      <div class="field">
        <label for="dateFrom">Дата получения</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="field">
        <label for="dateTo">Дата возврата</label>
        <input type="date" id="dateTo">
      </div>
    </div>
    
    <div class="field">
      <label for="clientName">Имя</label>
      <input type="text" id="clientName" placeholder="Как к вам обращаться">
    </div>

    <div class="field">
      <label for="clientPhone">Телефон</label>
      <div class="phone-input-group">
        <span class="phone-prefix">+996</span>
        <input type="tel" id="clientPhone" placeholder="000 000 000" maxlength="9">
      </div>
    </div>

    <div class="total-box">
      <span id="totalDays">0 дней</span>
      <span id="totalSum">0 ₽</span>
    </div>

    <p class="form-error" id="bookingError">Проверьте даты, имя и телефон</p>
    <button class="btn-primary" id="bookingSendBtn" style="width:100%;">Отправить заявку в WhatsApp</button>
  </div>

  <!-- Модальное окно авторизации -->
  <div class="modal" id="authModal">
    <button class="modal-close" id="authCloseBtn">&times;</button>
    <h3>Вход в аккаунт</h3>
    <p class="modal-sub">Войдите для сохранения истории бронирований</p>

    <button class="btn-google" id="googleAuthBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Войти через Google
    </button>

    <div class="auth-divider">или по номеру</div>

    <div id="smsStep1" class="sms-step active">
      <div class="field">
        <label for="authPhone">Номер телефона</label>
        <div class="phone-input-group">
          <span class="phone-prefix">+996</span>
          <input type="tel" id="authPhone" placeholder="000 000 000" maxlength="9">
        </div>
      </div>
      <button class="btn-primary" id="sendCodeBtn" style="width:100%;">Получить SMS-код</button>
    </div>

    <div id="smsStep2" class="sms-step">
      <div class="field">
        <label for="smsCode">SMS-код подлинности</label>
        <input type="text" id="smsCode" placeholder="Код из SMS (например: 4821)" maxlength="6">
      </div>
      <button class="btn-primary" id="verifyCodeBtn" style="width:100%;">Подтвердить код</button>
    </div>

    <p class="form-error" id="authError" style="margin-top:12px;"></p>
  </div>

<script>
(function(){
  // Нейтральный префикс для WhatsApp
  var OWNER_WHATSAPP = '996000000000'; 
  
        var CARS = [
    {id:'e1', cat:'Эконом', name:'Kia Rio', trans:'Механика', fuel:'6.5 л/100км', seats:'5 мест', price:1800, img:'./kia_rio_690702.webp'},
    {id:'e2', cat:'Эконом', name:'Hyundai Solaris', trans:'Автомат', fuel:'6.8 л/100км', seats:'5 мест', price:1800, img:'./изображения.jpeg'},
    {id:'e3', cat:'Эконом', name:'Renault Logan', trans:'Механика', fuel:'6.2 л/100км', seats:'5 мест', price:1700, img:'./изображения (1).jpeg'},
    {id:'c1', cat:'Комфорт', name:'Toyota Camry', trans:'Автомат', fuel:'8.5 л/100км', seats:'5 мест', price:3500, img:'./изображения (2).jpeg'},
    {id:'c2', cat:'Комфорт', name:'Skoda Octavia', trans:'Автомат', fuel:'7.2 л/100км', seats:'5 мест', price:3000, img:'./gen473_skoda_octavia_1187619.jpg'},
    {id:'c3', cat:'Комфорт', name:'Kia K5', trans:'Автомат', fuel:'7.8 л/100км', seats:'5 мест', price:3300, img:'./306932d59aa91fc6db47dffc25ec2410.jpg'},
    {id:'s1', cat:'Внедорожники', name:'Toyota Land Cruiser Prado', trans:'Автомат', fuel:'12 л/100км', seats:'7 мест', price:6500, img:'./изображения (3).jpeg'},
    {id:'s2', cat:'Внедорожники', name:'Hyundai Santa Fe', trans:'Автомат', fuel:'9.5 л/100км', seats:'5 мест', price:4800, img:'./изображения (4).jpeg'},
    {id:'s3', cat:'Внедорожники', name:'Mitsubishi Pajero Sport', trans:'Автомат', fuel:'11 л/100км', seats:'7 мест', price:5500, img:'./c331185dc1f1520d75d31af9370d50b2.jpg'}
  ];
  

  var cats = ['Все','Эконом','Комфорт','Внедорожники'];
  var activeCat = 'Все';

  function renderTabs(){
    var wrap = document.getElementById('catTabs');
    if(!wrap) return;
    wrap.innerHTML = '';
    cats.forEach(function(c){
      var btn = document.createElement('button');
      btn.className = 'cat-tab' + (c===activeCat ? ' active' : '');
      btn.textContent = c;
      btn.addEventListener('click', function(){
        activeCat = c;
        renderTabs();
        renderFleet();
      });
      wrap.appendChild(btn);
    });
  }

  function renderFleet(){
    var grid = document.getElementById('fleetGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var list = activeCat === 'Все' ? CARS : CARS.filter(function(c){return c.cat===activeCat;});
    list.forEach(function(car){
      var card = document.createElement('div');
      card.className = 'car-card';
      card.innerHTML =
        '<div class="car-visual"><img src="'+car.img+'" alt="'+car.name+'" loading="lazy"></div>' +
        '<div class="car-body">' +
          '<div class="car-cat">'+car.cat+'</div>' +
          '<div class="car-name">'+car.name+'</div>' +
          '<div class="car-specs">' +
            '<span class="car-spec">'+car.trans+'</span>' +
            '<span class="car-spec">'+car.fuel+'</span>' +
            '<span class="car-spec">'+car.seats+'</span>' +
          '</div>' +
          '<div class="car-foot">' +
            '<div class="car-price">'+car.price.toLocaleString('ru-RU')+' ₽<span> / сутки</span></div>' +
            '<button class="book-btn" data-id="'+car.id+'">Забронировать</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
    grid.querySelectorAll('.book-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ openBooking(btn.getAttribute('data-id')); });
    });
  }

  var overlay = document.getElementById('overlay');
  var modal = document.getElementById('bookingModal');
  var authModal = document.getElementById('authModal');
  var currentCar = null;
  var generatedCode = null;

  function openBooking(id){
    currentCar = CARS.find(function(c){return c.id===id;});
    if(!currentCar) return;
    document.getElementById('modalCarName').textContent = currentCar.name;
    document.getElementById('modalCarSpecs').textContent =
      currentCar.trans+' · '+currentCar.fuel+' · '+currentCar.seats+' · '+currentCar.price.toLocaleString('ru-RU')+' ₽/сутки';
    
    var today = new Date().toISOString().split('T')[0];
    document.getElementById('dateFrom').min = today;
    document.getElementById('dateTo').min = today;

    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('clientName').value = '';
    document.getElementById('clientPhone').value = '';
    document.getElementById('bookingError').classList.remove('show');
    updateTotal();
    modal.classList.add('show');
    overlay.classList.add('show');
  }

  function closeAllModals(){
    if(modal) modal.classList.remove('show');
    if(authModal) authModal.classList.remove('show');
    if(overlay) overlay.classList.remove('show');
  }

  if(document.getElementById('modalCloseBtn')) document.getElementById('modalCloseBtn').addEventListener('click', closeAllModals);
  if(document.getElementById('authCloseBtn')) document.getElementById('authCloseBtn').addEventListener('click', closeAllModals);
  if(overlay) overlay.addEventListener('click', closeAllModals);

  function daysBetween(from, to){
    var d1 = new Date(from), d2 = new Date(to);
    var diff = Math.round((d2 - d1) / (1000*60*60*24));
    return diff > 0 ? diff : 0;
  }

  function updateTotal(){
    var from = document.getElementById('dateFrom').value;
    var to = document.getElementById('dateTo').value;
    var days = (from && to) ? daysBetween(from, to) : 0;
    var sum = currentCar ? days * currentCar.price : 0;
    document.getElementById('totalDays').textContent = days + (days===1 ? ' день' : (days>=2 && days<=4 ? ' дня' : ' дней'));
    document.getElementById('totalSum').textContent = sum.toLocaleString('ru-RU') + ' ₽';
    return {days: days, sum: sum};
  }
  
  if(document.getElementById('dateFrom')) document.getElementById('dateFrom').addEventListener('change', updateTotal);
  if(document.getElementById('dateTo')) document.getElementById('dateTo').addEventListener('change', updateTotal);

  if(document.getElementById('bookingSendBtn')){
    document.getElementById('bookingSendBtn').addEventListener('click', function(){
      var from = document.getElementById('dateFrom').value;
      var to = document.getElementById('dateTo').value;
      var name = document.getElementById('clientName').value.trim();
      var phone = document.getElementById('clientPhone').value.trim();
      var t = updateTotal();
      if(!from || !to || t.days <= 0 || !name || !phone){
        document.getElementById('bookingError').classList.add('show');
        return;
      }
      var lines = [
        'Заявка на аренду авто — Nomad Rent:',
        'Машина: ' + currentCar.name + ' (' + currentCar.cat + ')',
        'Даты: ' + from + ' — ' + to + ' (' + t.days + (t.days===1?' день':(t.days>=2&&t.days<=4?' дня':' дней')) + ')',
        'Итого: ' + t.sum.toLocaleString('ru-RU') + ' ₽',
        'Имя: ' + name,
        'Телефон: +996' + phone
      ];
      var text = encodeURIComponent(lines.join('\n'));
      window.open('https://wa.me/' + OWNER_WHATSAPP + '?text=' + text, '_blank');
      closeAllModals();
    });
  }

  /* Авторизация */
  if(document.getElementById('openAuthBtn')){
    document.getElementById('openAuthBtn').addEventListener('click', function(){
      document.getElementById('smsStep1').classList.add('active');
      document.getElementById('smsStep2').classList.remove('active');
      document.getElementById('authError').classList.remove('show');
      authModal.classList.add('show');
      overlay.classList.add('show');
    });
  }

  if(document.getElementById('googleAuthBtn')){
    document.getElementById('googleAuthBtn').addEventListener('click', function(){
      alert('Успешный вход через Google!');
      if(document.getElementById('openAuthBtn')) document.getElementById('openAuthBtn').textContent = 'Профиль';
      closeAllModals();
    });
  }

  if(document.getElementById('sendCodeBtn')){
    document.getElementById('sendCodeBtn').addEventListener('click', function(){
      var phone = document.getElementById('authPhone').value.trim();
      var err = document.getElementById('authError');
      if(!phone || phone.length < 7){
        err.textContent = 'Введите корректный номер телефона';
        err.classList.add('show');
        return;
      }
      generatedCode = Math.floor(1000 + Math.random() * 9000);
      alert('SMS-код проверки: ' + generatedCode);
      err.classList.remove('show');
      document.getElementById('smsStep1').classList.remove('active');
      document.getElementById('smsStep2').classList.add('active');
    });
  }

  if(document.getElementById('verifyCodeBtn')){
    document.getElementById('verifyCodeBtn').addEventListener('click', function(){
      var code = document.getElementById('smsCode').value.trim();
      var err = document.getElementById('authError');
      if(code === String(generatedCode)){
        alert('Номер подтвержден! Вы успешно вошли.');
        if(document.getElementById('openAuthBtn')) document.getElementById('openAuthBtn').textContent = 'Профиль';
        closeAllModals();
      } else {
        err.textContent = 'Неверный SMS-код!';
        err.classList.add('show');
      }
    });
  }

  renderTabs();
  renderFleet();
})();
</script>

</body>
</html>
